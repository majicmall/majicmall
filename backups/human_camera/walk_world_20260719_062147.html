{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>
    Walk the Mall™
    {% if zone %}— {{ zone.name }}{% endif %}
    | MajicMall Megaverse
  </title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <style>
    :root {
      --gold-soft: #ffe6a3;
      --gold-bright: #ffd36a;
      --gold-deep: #9c641c;
      --black-glass: rgba(4, 5, 8, 0.72);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
    }

    button,
    a {
      font: inherit;
    }

    .living-world {
      position: fixed;
      inset: 0;
      isolation: isolate;
      overflow: hidden;
      background: #000;
    }

    /*
    ============================================================
    LIVING WORLD CAMERA
    The image is enlarged beyond the viewport so the camera can
    advance without revealing an edge.
    ============================================================
    */

    .world-camera {
      position: absolute;
      z-index: 0;
      inset: -11%;
      overflow: hidden;
      transform: translateZ(0);
    }

    .world-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      user-select: none;
      pointer-events: none;

      transform:
        translate3d(0, 1.6%, 0)
        scale(1.02);

      transform-origin: center 58%;

      animation:
        walkForward 18s
        cubic-bezier(0.42, 0.04, 0.18, 1)
        infinite alternate;

      will-change: transform, filter;
      backface-visibility: hidden;
    }

    @keyframes walkForward {
      0% {
        transform:
          translate3d(0, 1.8%, 0)
          scale(1.02);

        filter:
          saturate(1.05)
          contrast(1.02)
          brightness(0.96);
      }

      38% {
        transform:
          translate3d(-0.45%, 0.6%, 0)
          scale(1.095);

        filter:
          saturate(1.1)
          contrast(1.035)
          brightness(1);
      }

      72% {
        transform:
          translate3d(0.4%, -0.45%, 0)
          scale(1.17);

        filter:
          saturate(1.12)
          contrast(1.045)
          brightness(1.025);
      }

      100% {
        transform:
          translate3d(0, -1.4%, 0)
          scale(1.245);

        filter:
          saturate(1.14)
          contrast(1.05)
          brightness(1.04);
      }
    }

    /*
    ============================================================
    CINEMATIC DEPTH
    ============================================================
    */

    .world-depth {
      position: absolute;
      z-index: 1;
      inset: 0;
      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.17) 0%,
          transparent 21%,
          transparent 66%,
          rgba(0, 0, 0, 0.14) 100%
        ),
        radial-gradient(
          ellipse at center 46%,
          transparent 28%,
          rgba(0, 0, 0, 0.08) 67%,
          rgba(0, 0, 0, 0.36) 100%
        );
    }

    /*
    ============================================================
    VISIBLE LIGHT TRAVEL
    These are atmosphere only—not fake architecture.
    ============================================================
    */

    .moving-light {
      position: absolute;
      z-index: 2;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .moving-light::before,
    .moving-light::after {
      content: "";
      position: absolute;
      top: -35%;
      width: 34%;
      height: 175%;
      opacity: 0.45;
      filter: blur(27px);
      transform-origin: center top;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 209, 111, 0.05) 18%,
          rgba(255, 233, 177, 0.26) 42%,
          rgba(255, 251, 229, 0.57) 50%,
          rgba(255, 222, 145, 0.24) 59%,
          transparent 82%
        );
    }

    .moving-light::before {
      left: -30%;
      animation: sweepLeft 10s ease-in-out infinite alternate;
    }

    .moving-light::after {
      right: -30%;
      animation: sweepRight 12s ease-in-out infinite alternate;
    }

    @keyframes sweepLeft {
      0% {
        opacity: 0.18;
        transform:
          translate3d(-8vw, 0, 0)
          rotate(15deg);
      }

      42% {
        opacity: 0.58;
      }

      100% {
        opacity: 0.34;
        transform:
          translate3d(79vw, 0, 0)
          rotate(-12deg);
      }
    }

    @keyframes sweepRight {
      0% {
        opacity: 0.26;
        transform:
          translate3d(8vw, 0, 0)
          rotate(-15deg);
      }

      48% {
        opacity: 0.64;
      }

      100% {
        opacity: 0.38;
        transform:
          translate3d(-79vw, 0, 0)
          rotate(12deg);
      }
    }

    /*
    ============================================================
    FLOOR LIGHT
    ============================================================
    */

    .floor-gleam {
      position: absolute;
      z-index: 3;
      right: -30%;
      bottom: -12%;
      left: -30%;
      height: 34%;
      pointer-events: none;
      opacity: 0.54;
      mix-blend-mode: screen;

      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 233, 179, 0.24),
          rgba(255, 195, 78, 0.07) 43%,
          transparent 73%
        );

      filter: blur(17px);
      animation: floorBreathe 5.5s ease-in-out infinite alternate;
    }

    @keyframes floorBreathe {
      from {
        opacity: 0.27;
        transform: scaleX(0.87);
      }

      to {
        opacity: 0.62;
        transform: scaleX(1.08);
      }
    }

    /*
    ============================================================
    MINIMAL CONTROLS
    No promotional card or fake app navigation.
    ============================================================
    */

    .world-controls {
      position: absolute;
      z-index: 10;
      top: calc(18px + var(--safe-top));
      right: calc(18px + var(--safe-right));
      left: calc(18px + var(--safe-left));

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      pointer-events: none;
    }

    .world-button,
    .world-label {
      pointer-events: auto;
      border: 1px solid rgba(255, 217, 127, 0.68);
      background:
        linear-gradient(
          180deg,
          rgba(15, 16, 20, 0.84),
          rgba(2, 3, 5, 0.8)
        );
      color: var(--gold-soft);
      box-shadow:
        0 0 17px rgba(255, 197, 73, 0.16),
        inset 0 1px 0 rgba(255, 241, 202, 0.13);
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
    }

    .world-button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 17px;
      border-radius: 999px;
      text-decoration: none;
      letter-spacing: 0.055em;
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease;
    }

    .world-button:hover,
    .world-button:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(255, 238, 185, 0.96);
      box-shadow:
        0 0 22px rgba(255, 201, 83, 0.34),
        inset 0 1px 0 rgba(255, 248, 224, 0.2);
    }

    .world-label {
      min-width: 0;
      max-width: min(56vw, 620px);
      padding: 10px 20px;
      overflow: hidden;
      border-radius: 999px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .world-label__eyebrow {
      display: block;
      margin-bottom: 2px;
      color: rgba(255, 255, 255, 0.72);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .world-label__name {
      display: block;
      overflow: hidden;
      color: var(--gold-soft);
      font-size: clamp(0.92rem, 2vw, 1.28rem);
      letter-spacing: 0.08em;
      text-overflow: ellipsis;
      text-shadow: 0 0 14px rgba(255, 202, 82, 0.25);
      white-space: nowrap;
    }

    .experience-status {
      position: absolute;
      z-index: 10;
      right: 0;
      bottom: calc(18px + var(--safe-bottom));
      left: 0;
      display: flex;
      justify-content: center;
      padding: 0 20px;
      pointer-events: none;
    }

    .status-pill {
      padding: 8px 16px;
      border: 1px solid rgba(255, 219, 135, 0.34);
      border-radius: 999px;
      background: rgba(2, 3, 5, 0.56);
      color: rgba(255, 239, 197, 0.88);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.71rem;
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /*
    ============================================================
    MOBILE
    ============================================================
    */

    @media (max-width: 700px) {
      .world-camera {
        inset: -15%;
      }

      .world-image {
        object-position: 50% center;
        animation-duration: 16s;
      }

      @keyframes walkForward {
        0% {
          transform:
            translate3d(0, 1.1%, 0)
            scale(1.055);
        }

        45% {
          transform:
            translate3d(-0.35%, 0, 0)
            scale(1.13);
        }

        100% {
          transform:
            translate3d(0.25%, -1%, 0)
            scale(1.22);
        }
      }

      .world-controls {
        top: calc(12px + var(--safe-top));
        right: calc(12px + var(--safe-right));
        left: calc(12px + var(--safe-left));
      }

      .world-button {
        min-width: 46px;
        min-height: 46px;
        padding: 10px 13px;
      }

      .world-button__text {
        display: none;
      }

      .world-label {
        max-width: calc(100vw - 126px);
        padding: 9px 13px;
      }

      .moving-light::before,
      .moving-light::after {
        width: 50%;
        filter: blur(19px);
      }

      .status-pill {
        max-width: 90vw;
        font-size: 0.63rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .world-image,
      .moving-light::before,
      .moving-light::after,
      .floor-gleam {
        animation: none !important;
      }

      .world-image {
        transform: scale(1.09);
      }
    }
  </style>
</head>

<body>
  <main class="living-world">
    <div class="world-camera" aria-hidden="true">
      <img
        class="world-image"
        src="{% static 'img/living_world_master_v1.webp' %}"
        alt=""
      >
    </div>

    <div class="world-depth" aria-hidden="true"></div>
    <div class="moving-light" aria-hidden="true"></div>
    <div class="floor-gleam" aria-hidden="true"></div>

    <nav class="world-controls" aria-label="Walk the Mall controls">
      <a class="world-button" href="/directory/">
        <span aria-hidden="true">‹</span>
        <span class="world-button__text">Directory</span>
      </a>

      <div class="world-label">
        <span class="world-label__eyebrow">Now walking</span>

        <span class="world-label__name">
          {% if zone %}
            {{ zone.name }}
          {% else %}
            MajicMall Megaverse
          {% endif %}
        </span>
      </div>

      <button
        class="world-button"
        id="pauseWorld"
        type="button"
        aria-pressed="false"
      >
        <span id="pauseIcon" aria-hidden="true">Ⅱ</span>
        <span class="world-button__text" id="pauseText">Pause</span>
      </button>
    </nav>

    <div class="experience-status">
      <div class="status-pill">
        Living World preview · Merchant display preserved for phase two
      </div>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const pauseButton = document.getElementById("pauseWorld");
      const pauseText = document.getElementById("pauseText");
      const pauseIcon = document.getElementById("pauseIcon");

      const animatedElements = [
        document.querySelector(".world-image"),
        document.querySelector(".moving-light"),
        document.querySelector(".floor-gleam")
      ].filter(Boolean);

      let paused = false;

      function applyPlaybackState() {
        animatedElements.forEach((element) => {
          element.style.animationPlayState = paused ? "paused" : "running";
        });

        pauseButton.setAttribute("aria-pressed", String(paused));
        pauseText.textContent = paused ? "Resume" : "Pause";
        pauseIcon.textContent = paused ? "▶" : "Ⅱ";
      }

      pauseButton.addEventListener("click", () => {
        paused = !paused;
        applyPlaybackState();
      });
    })();
  </script>
</body>
</html>
