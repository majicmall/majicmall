{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>
    Walk the Mall™
    {% if zone %}— {{ zone.name }}{% endif %}
    | MajicMall Megaverse
  </title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <style>
    :root {
      --gold-soft: #ffe6a3;
      --gold-bright: #ffd36a;
      --gold-deep: #9c641c;
      --black-glass: rgba(4, 5, 8, 0.72);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
    }

    button,
    a {
      font: inherit;
    }

    .living-world {
      position: fixed;
      inset: 0;
      isolation: isolate;
      overflow: hidden;
      background: #000;
    }

    /*
    ============================================================
    LIVING WORLD CAMERA
    The image is enlarged beyond the viewport so the camera can
    advance without revealing an edge.
    ============================================================
    */

    .world-camera {
      position: absolute;
      z-index: 0;
      inset: -11%;
      overflow: hidden;
      transform: translateZ(0);
    }

    .world-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      user-select: none;
      pointer-events: none;

      transform:
        translate3d(0, 1.6%, 0)
        scale(1.02);

      transform-origin: center 58%;

      animation: infiniteWalk 18s ease-in-out infinite alternate;

      will-change: transform, filter;
      backface-visibility: hidden;
    }

    @keyframes walkForward {
      0% {
        transform:
          translate3d(0, 1.8%, 0)
          scale(1.02);

        filter:
          saturate(1.05)
          contrast(1.02)
          brightness(0.96);
      }

      38% {
        transform:
          translate3d(-0.45%, 0.6%, 0)
          scale(1.095);

        filter:
          saturate(1.1)
          contrast(1.035)
          brightness(1);
      }

      72% {
        transform:
          translate3d(0.4%, -0.45%, 0)
          scale(1.17);

        filter:
          saturate(1.12)
          contrast(1.045)
          brightness(1.025);
      }

      100% {
        transform:
          translate3d(0, -1.4%, 0)
          scale(1.245);

        filter:
          saturate(1.14)
          contrast(1.05)
          brightness(1.04);
      }
    }

    /*
    ============================================================
    CINEMATIC DEPTH
    ============================================================
    */

    .world-depth {
      position: absolute;
      z-index: 1;
      inset: 0;
      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.17) 0%,
          transparent 21%,
          transparent 66%,
          rgba(0, 0, 0, 0.14) 100%
        ),
        radial-gradient(
          ellipse at center 46%,
          transparent 28%,
          rgba(0, 0, 0, 0.08) 67%,
          rgba(0, 0, 0, 0.36) 100%
        );
    }

    /*
    ============================================================
    VISIBLE LIGHT TRAVEL
    These are atmosphere only—not fake architecture.
    ============================================================
    */

    .moving-light {
      position: absolute;
      z-index: 2;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .moving-light::before,
    .moving-light::after {
      content: "";
      position: absolute;
      top: -35%;
      width: 34%;
      height: 175%;
      opacity: 0.45;
      filter: blur(27px);
      transform-origin: center top;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 209, 111, 0.05) 18%,
          rgba(255, 233, 177, 0.26) 42%,
          rgba(255, 251, 229, 0.57) 50%,
          rgba(255, 222, 145, 0.24) 59%,
          transparent 82%
        );
    }

    .moving-light::before {
      left: -30%;
      animation: sweepLeft 10s ease-in-out infinite alternate;
    }

    .moving-light::after {
      right: -30%;
      animation: sweepRight 12s ease-in-out infinite alternate;
    }

    @keyframes sweepLeft {
      0% {
        opacity: 0.18;
        transform:
          translate3d(-8vw, 0, 0)
          rotate(15deg);
      }

      42% {
        opacity: 0.58;
      }

      100% {
        opacity: 0.34;
        transform:
          translate3d(79vw, 0, 0)
          rotate(-12deg);
      }
    }

    @keyframes sweepRight {
      0% {
        opacity: 0.26;
        transform:
          translate3d(8vw, 0, 0)
          rotate(-15deg);
      }

      48% {
        opacity: 0.64;
      }

      100% {
        opacity: 0.38;
        transform:
          translate3d(-79vw, 0, 0)
          rotate(12deg);
      }
    }

    /*
    ============================================================
    FLOOR LIGHT
    ============================================================
    */

    .floor-gleam {
      position: absolute;
      z-index: 3;
      right: -30%;
      bottom: -12%;
      left: -30%;
      height: 34%;
      pointer-events: none;
      opacity: 0.54;
      mix-blend-mode: screen;

      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 233, 179, 0.24),
          rgba(255, 195, 78, 0.07) 43%,
          transparent 73%
        );

      filter: blur(17px);
      animation: floorBreathe 5.5s ease-in-out infinite alternate;
    }

    @keyframes floorBreathe {
      from {
        opacity: 0.27;
        transform: scaleX(0.87);
      }

      to {
        opacity: 0.62;
        transform: scaleX(1.08);
      }
    }

    /*
    ============================================================
    MINIMAL CONTROLS
    No promotional card or fake app navigation.
    ============================================================
    */

    .world-controls {
      position: absolute;
      z-index: 10;
      top: calc(18px + var(--safe-top));
      right: calc(18px + var(--safe-right));
      left: calc(18px + var(--safe-left));

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      pointer-events: none;
    }

    .world-button,
    .world-label {
      pointer-events: auto;
      border: 1px solid rgba(255, 217, 127, 0.68);
      background:
        linear-gradient(
          180deg,
          rgba(15, 16, 20, 0.84),
          rgba(2, 3, 5, 0.8)
        );
      color: var(--gold-soft);
      box-shadow:
        0 0 17px rgba(255, 197, 73, 0.16),
        inset 0 1px 0 rgba(255, 241, 202, 0.13);
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
    }

    .world-button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 17px;
      border-radius: 999px;
      text-decoration: none;
      letter-spacing: 0.055em;
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease;
    }

    .world-button:hover,
    .world-button:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(255, 238, 185, 0.96);
      box-shadow:
        0 0 22px rgba(255, 201, 83, 0.34),
        inset 0 1px 0 rgba(255, 248, 224, 0.2);
    }

    .world-label {
      min-width: 0;
      max-width: min(56vw, 620px);
      padding: 10px 20px;
      overflow: hidden;
      border-radius: 999px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .world-label__eyebrow {
      display: block;
      margin-bottom: 2px;
      color: rgba(255, 255, 255, 0.72);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .world-label__name {
      display: block;
      overflow: hidden;
      color: var(--gold-soft);
      font-size: clamp(0.92rem, 2vw, 1.28rem);
      letter-spacing: 0.08em;
      text-overflow: ellipsis;
      text-shadow: 0 0 14px rgba(255, 202, 82, 0.25);
      white-space: nowrap;
    }

    .experience-status {
      position: absolute;
      z-index: 10;
      right: 0;
      bottom: calc(18px + var(--safe-bottom));
      left: 0;
      display: flex;
      justify-content: center;
      padding: 0 20px;
      pointer-events: none;
    }

    .status-pill {
      padding: 8px 16px;
      border: 1px solid rgba(255, 219, 135, 0.34);
      border-radius: 999px;
      background: rgba(2, 3, 5, 0.56);
      color: rgba(255, 239, 197, 0.88);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.71rem;
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /*
    ============================================================
    MOBILE
    ============================================================
    */

    @media (max-width: 700px) {
      .world-camera {
        inset: -15%;
      }

      .world-image {
        object-position: 50% center;
        animation-duration: 16s;
      }

      @keyframes walkForward {
        0% {
          transform:
            translate3d(0, 1.1%, 0)
            scale(1.055);
        }

        45% {
          transform:
            translate3d(-0.35%, 0, 0)
            scale(1.13);
        }

        100% {
          transform:
            translate3d(0.25%, -1%, 0)
            scale(1.22);
        }
      }

      .world-controls {
        top: calc(12px + var(--safe-top));
        right: calc(12px + var(--safe-right));
        left: calc(12px + var(--safe-left));
      }

      .world-button {
        min-width: 46px;
        min-height: 46px;
        padding: 10px 13px;
      }

      .world-button__text {
        display: none;
      }

      .world-label {
        max-width: calc(100vw - 126px);
        padding: 9px 13px;
      }

      .moving-light::before,
      .moving-light::after {
        width: 50%;
        filter: blur(19px);
      }

      .status-pill {
        max-width: 90vw;
        font-size: 0.63rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .world-image,
      .moving-light::before,
      .moving-light::after,
      .floor-gleam {
        animation: none !important;
      }

      .world-image {
        transform: scale(1.09);
      }
    }
  
    /* OPERATION HUMAN CAMERA — START */

    /*
    ============================================================
    NATURAL WALKING CAMERA

    Forward movement remains dominant.
    Side sway and vertical motion stay intentionally restrained.
    ============================================================
    */

    .world-camera {
      inset: -14%;
      perspective: 1400px;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
    }

    .world-image {
      transform-origin: center 55%;

      animation: infiniteWalk 18s ease-in-out infinite alternate;

      will-change: transform, filter;
    }

    @keyframes humanMallWalk {
      0% {
        transform:
          translate3d(-0.35%, 1.55%, 0)
          rotateZ(-0.055deg)
          scale(1.035);

        filter:
          saturate(1.06)
          contrast(1.025)
          brightness(0.97);
      }

      10% {
        transform:
          translate3d(-0.12%, 1.12%, 0)
          rotateZ(0.025deg)
          scale(1.06);
      }

      21% {
        transform:
          translate3d(0.24%, 0.92%, 0)
          rotateZ(0.055deg)
          scale(1.085);
      }

      31% {
        transform:
          translate3d(0.46%, 0.46%, 0)
          rotateZ(-0.018deg)
          scale(1.112);
      }

      42% {
        transform:
          translate3d(0.17%, 0.2%, 0)
          rotateZ(-0.06deg)
          scale(1.14);

        filter:
          saturate(1.09)
          contrast(1.035)
          brightness(1);
      }

      53% {
        transform:
          translate3d(-0.28%, -0.14%, 0)
          rotateZ(0.015deg)
          scale(1.168);
      }

      64% {
        transform:
          translate3d(-0.5%, -0.32%, 0)
          rotateZ(0.065deg)
          scale(1.198);
      }

      75% {
        transform:
          translate3d(-0.16%, -0.68%, 0)
          rotateZ(-0.012deg)
          scale(1.226);
      }

      87% {
        transform:
          translate3d(0.32%, -0.92%, 0)
          rotateZ(-0.055deg)
          scale(1.258);
      }

      100% {
        transform:
          translate3d(0.45%, -1.22%, 0)
          rotateZ(0.025deg)
          scale(1.29);

        filter:
          saturate(1.13)
          contrast(1.045)
          brightness(1.035);
      }
    }

    /*
    ============================================================
    CENTER-DEPTH PULSE

    Creates a gentle approach sensation at the corridor's
    vanishing point without covering storefront detail.
    ============================================================
    */

    .world-depth::before {
      content: "";
      position: absolute;
      top: 25%;
      left: 50%;
      width: 35%;
      height: 39%;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 241, 205, 0.13) 0%,
          rgba(255, 211, 110, 0.045) 38%,
          transparent 72%
        );

      filter: blur(20px);
      mix-blend-mode: screen;

      transform:
        translate3d(-50%, 0, 0)
        scale(0.88);

      animation:
        corridorDepthPulse
        7.5s
        ease-in-out
        infinite
        alternate;
    }

    @keyframes corridorDepthPulse {
      0% {
        opacity: 0.23;

        transform:
          translate3d(-50%, 1.5%, 0)
          scale(0.88);
      }

      100% {
        opacity: 0.62;

        transform:
          translate3d(-50%, -1%, 0)
          scale(1.13);
      }
    }

    /*
    ============================================================
    WALKING FLOOR REFLECTION

    A soft reflection travels toward the viewer while the
    background camera advances.
    ============================================================
    */

    .floor-gleam {
      right: -38%;
      bottom: -14%;
      left: -38%;
      height: 42%;

      background:
        radial-gradient(
          ellipse at center 15%,
          rgba(255, 247, 217, 0.3),
          rgba(255, 204, 92, 0.12) 34%,
          rgba(255, 188, 55, 0.045) 57%,
          transparent 76%
        );

      animation:
        approachingReflection
        6.8s
        ease-in-out
        infinite
        alternate;

      will-change: transform, opacity;
    }

    .floor-gleam::before {
      content: "";
      position: absolute;
      top: 0;
      left: -28%;
      width: 24%;
      height: 100%;
      opacity: 0;

      background:
        linear-gradient(
          102deg,
          transparent,
          rgba(255, 217, 132, 0.1),
          rgba(255, 251, 228, 0.36),
          rgba(255, 218, 137, 0.1),
          transparent
        );

      filter: blur(6px);

      animation:
        floorLightTravel
        8.5s
        ease-in-out
        infinite;
    }

    @keyframes approachingReflection {
      0% {
        opacity: 0.25;

        transform:
          translate3d(0, 3%, 0)
          scale3d(0.82, 0.76, 1);
      }

      100% {
        opacity: 0.68;

        transform:
          translate3d(0, -1%, 0)
          scale3d(1.15, 1.12, 1);
      }
    }

    @keyframes floorLightTravel {
      0%,
      14% {
        left: -28%;
        opacity: 0;
      }

      28% {
        opacity: 0.5;
      }

      70% {
        opacity: 0.62;
      }

      88%,
      100% {
        left: 115%;
        opacity: 0;
      }
    }

    /*
    ============================================================
    LIGHT MOVEMENT TUNING

    More visible than the original, but still secondary to the
    realistic mall artwork.
    ============================================================
    */

    .moving-light::before,
    .moving-light::after {
      width: 29%;
      opacity: 0.58;
      filter: blur(23px);
    }

    .moving-light::before {
      animation-duration: 13.5s;
    }

    .moving-light::after {
      animation-duration: 15.5s;
    }

    /*
    ============================================================
    SUBTLE VIEWER MOMENTUM

    The overall world receives a tiny floating movement separate
    from the forward zoom. This produces a human rather than
    robotic camera.
    ============================================================
    */

    .world-depth,
    .moving-light {
      animation:
        viewerMomentum
        5.4s
        ease-in-out
        infinite
        alternate;
    }

    @keyframes viewerMomentum {
      0% {
        transform: translate3d(-0.08%, 0.08%, 0);
      }

      50% {
        transform: translate3d(0.06%, -0.06%, 0);
      }

      100% {
        transform: translate3d(0.11%, 0.04%, 0);
      }
    }

    /*
    ============================================================
    MOBILE WALK TUNING

    Reduced side sway, slightly stronger forward movement.
    ============================================================
    */

    @media (max-width: 700px) {
      .world-camera {
        inset: -20%;
      }

      .world-image {
        object-position: center center;
        animation-name: humanMallWalkMobile;
        animation-duration: 20s;
      }

      @keyframes humanMallWalkMobile {
        0% {
          transform:
            translate3d(-0.16%, 1.1%, 0)
            rotateZ(-0.025deg)
            scale(1.065);

          filter:
            saturate(1.05)
            contrast(1.02)
            brightness(0.97);
        }

        25% {
          transform:
            translate3d(0.18%, 0.58%, 0)
            rotateZ(0.02deg)
            scale(1.115);
        }

        50% {
          transform:
            translate3d(-0.12%, 0.06%, 0)
            rotateZ(-0.02deg)
            scale(1.17);
        }

        75% {
          transform:
            translate3d(0.15%, -0.48%, 0)
            rotateZ(0.018deg)
            scale(1.225);
        }

        100% {
          transform:
            translate3d(0.08%, -0.92%, 0)
            rotateZ(-0.018deg)
            scale(1.285);

          filter:
            saturate(1.11)
            contrast(1.04)
            brightness(1.025);
        }
      }

      .world-depth::before {
        top: 29%;
        width: 52%;
        height: 35%;
      }

      .moving-light::before,
      .moving-light::after {
        width: 44%;
        opacity: 0.48;
        filter: blur(17px);
      }

      .floor-gleam {
        height: 36%;
      }
    }

    /*
    ============================================================
    REDUCED MOTION ACCESSIBILITY
    ============================================================
    */

    @media (prefers-reduced-motion: reduce) {
      .world-image,
      .world-depth,
      .world-depth::before,
      .moving-light,
      .moving-light::before,
      .moving-light::after,
      .floor-gleam,
      .floor-gleam::before {
        animation: none !important;
      }

      .world-image {
        transform: scale(1.1);
      }
    }

    /* OPERATION HUMAN CAMERA — END */

  
@keyframes infiniteWalk {
    0%{
        transform:
            translateY(2%)
            scale(1.03);
        filter:
            brightness(.96)
            saturate(1.04);
    }

    25%{
        transform:
            translateY(1%)
            scale(1.08);
    }

    50%{
        transform:
            translateY(0%)
            scale(1.14);
    }

    75%{
        transform:
            translateY(-1%)
            scale(1.20);
    }

    100%{
        transform:
            translateY(-2%)
            scale(1.28);
        filter:
            brightness(1.03)
            saturate(1.10);
    }
}

</style>
</head>

<body>
  <main class="living-world">
    <div class="world-camera" aria-hidden="true">
      <img
        class="world-image"
        src="{% static 'img/living_world_master_v1.webp' %}"
        alt=""
      >
    </div>

    <div class="world-depth" aria-hidden="true"></div>
    <div class="moving-light" aria-hidden="true"></div>
    <div class="floor-gleam" aria-hidden="true"></div>

    <nav class="world-controls" aria-label="Walk the Mall controls">
      <a class="world-button" href="/directory/">
        <span aria-hidden="true">‹</span>
        <span class="world-button__text">Directory</span>
      </a>

      <div class="world-label">
        <span class="world-label__eyebrow">Now walking</span>

        <span class="world-label__name">
          {% if zone %}
            {{ zone.name }}
          {% else %}
            MajicMall Megaverse
          {% endif %}
        </span>
      </div>

      <button
        class="world-button"
        id="pauseWorld"
        type="button"
        aria-pressed="false"
      >
        <span id="pauseIcon" aria-hidden="true">Ⅱ</span>
        <span class="world-button__text" id="pauseText">Pause</span>
      </button>
    </nav>

    <div class="experience-status">
      <div class="status-pill">
        Living World preview · Merchant display preserved for phase two
      </div>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const pauseButton = document.getElementById("pauseWorld");
      const pauseText = document.getElementById("pauseText");
      const pauseIcon = document.getElementById("pauseIcon");

      const animatedElements = [
        document.querySelector(".world-image"),
        document.querySelector(".moving-light"),
        document.querySelector(".floor-gleam")
      ].filter(Boolean);

      let paused = false;

      function applyPlaybackState() {
        animatedElements.forEach((element) => {
          element.style.animationPlayState = paused ? "paused" : "running";
        });

        pauseButton.setAttribute("aria-pressed", String(paused));
        pauseText.textContent = paused ? "Resume" : "Pause";
        pauseIcon.textContent = paused ? "▶" : "Ⅱ";
      }

      pauseButton.addEventListener("click", () => {
        paused = !paused;
        applyPlaybackState();
      });
    })();
  </script>
</body>
</html>
